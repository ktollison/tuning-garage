name: CI

# CI for the public project AND for every private copy made from it with
# "Use this template".
#
# Everywhere: the tests and a smoke test, on the oldest and newest supported
# Node. Only on the PUBLIC project (github.repository below): the docs gate,
# the binary and scrub checks, and the Windows/macOS matrix. A private copy is
# supposed to hold your stock read and tune files and your own README, and
# macOS minutes are ten times the price, so none of those run there.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Unit tests (analysis maths)
        run: node scripts/test.mjs

      # Fails when a doc names a file that is not here, a link is broken, the
      # changelog is out of shape, or the docs and code disagree about a tab, an
      # endpoint or the minimum Node version.
      - name: Docs match the code
        if: github.repository == 'ktollison/tuning-garage'
        run: node scripts/check-kit-docs.mjs

      - name: No calibration binaries in the tree
        if: github.repository == 'ktollison/tuning-garage'
        run: |
          if find . -path ./.git -prune -o \( -name '*.bin' -o -name '*.hpt' -o -name '*.hpl' \) -print | grep .; then
            echo "Calibration files must never be committed here — see CONTRIBUTING.md"
            exit 1
          fi
          echo "Clean."

      - name: Submitted logs are scrubbed
        if: github.repository == 'ktollison/tuning-garage'
        run: |
          logs=$(find submissions -name '*.csv' 2>/dev/null || true)
          if [ -z "$logs" ]; then echo "No submitted logs."; exit 0; fi
          # shellcheck disable=SC2086
          node scripts/scrub-log.mjs --check $logs

      - name: Smoke test the app
        run: |
          PORT=4599 node app/server.mjs &
          PORT=4599 node scripts/smoke.mjs

  # The project is used on Windows and macOS far more than Linux, and its worst
  # bugs have been platform bugs. Public repository only.
  cross-platform:
    if: github.repository == 'ktollison/tuning-garage'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node-version: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Unit tests
        run: node scripts/test.mjs
