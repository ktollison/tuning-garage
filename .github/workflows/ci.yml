name: CI

# CI for the public project AND for every private copy made from it with
# "Use this template". The tests and smoke test run everywhere. The binary and
# scrub checks guard what the PUBLIC project accepts; a private copy is
# supposed to hold your stock read and tune files, so there they are skipped —
# otherwise your first tune check-in would turn every push red.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (analysis maths)
        run: node scripts/test.mjs

      - name: No calibration binaries in the tree
        if: github.repository == 'ktollison/tuning-garage'
        run: |
          if find . -path ./.git -prune -o \( -name '*.bin' -o -name '*.hpt' -o -name '*.hpl' \) -print | grep .; then
            echo "Calibration files must never be committed here — see CONTRIBUTING.md"
            exit 1
          fi
          echo "Clean."

      - name: Submitted logs are scrubbed
        if: github.repository == 'ktollison/tuning-garage'
        run: |
          logs=$(find submissions -name '*.csv' 2>/dev/null || true)
          if [ -z "$logs" ]; then echo "No submitted logs."; exit 0; fi
          # shellcheck disable=SC2086
          node scripts/scrub-log.mjs --check $logs

      - name: Smoke test the app
        run: |
          PORT=4599 node app/server.mjs &
          PORT=4599 node scripts/smoke.mjs
