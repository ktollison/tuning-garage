<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuning Garage report</title>
<style>
  :root { --ink:#111; --ink2:#444; --muted:#777; --grid:#d9d9d4; --surface:#f6f6f3; --warn:#9a4a00; }
  * { box-sizing: border-box; }
  body { font: 13.5px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; margin: 0; padding: 28px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--grid); border-radius: 8px; font-size: 13px; }
  .bar button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #2a78d6; background: #2a78d6; color: #fff; cursor: pointer; }
  h1 { font-size: 21px; margin: 0 0 8px; }
  h2 { font-size: 16px; margin: 22px 0 6px; padding-top: 10px; border-top: 1px solid var(--grid); }
  h3 { font-size: 14px; margin: 14px 0 4px; }
  p, li { color: var(--ink2); }
  ul { padding-left: 20px; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 12px; font-size: 12.5px; }
  th, td { border-bottom: 1px solid var(--grid); padding: 4px 8px 4px 0; text-align: left; vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  code, pre { font: 12px ui-monospace, Menlo, Consolas, monospace; }
  pre.md { white-space: pre-wrap; background: var(--surface); padding: 8px 10px; border-radius: 6px; }
  hr { border: 0; border-top: 1px solid var(--grid); margin: 18px 0; }
  .err { color: var(--warn); }
  @page { margin: 16mm 14mm; }
  @media print {
    body { padding: 0; }
    .bar { display: none; }
    h2 { break-after: avoid; }
    table, tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><span id="what">Loading report…</span><span style="flex:1"></span>
    <button onclick="window.print()">Print / Save as PDF</button></div>
  <div id="doc"></div>
</div>
<script src="markdown.js"></script>
<script>
// Renders /api/report with this page's own query string, then opens the
// browser's print dialog, where "Save as PDF" produces the file. Zero
// dependencies: the browser is the PDF engine.
function viewDoc() {}                       // links to other docs do nothing on paper
(async () => {
  const qs = location.search.slice(1);
  try {
    const r = await fetch(`/api/report?${qs}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    document.title = data.filename.replace(/\.md$/, "");
    document.getElementById("what").textContent = data.filename.replace(/\.md$/, ".pdf") + " — choose “Save as PDF” in the print dialog";
    document.getElementById("doc").innerHTML = renderMarkdown(data.markdown);
    setTimeout(() => window.print(), 300);
  } catch (e) {
    document.getElementById("what").textContent = "Could not build the report";
    document.getElementById("doc").innerHTML = `<p class="err">${esc(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
